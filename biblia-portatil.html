lhe com todos que encontrar. Amém."}, "12-11": {"ref": "Is 61,1", "verso": "O Espírito do Senhor está sobre mim, porque o Senhor me ungiu para pregar boas novas aos pobres.", "tema": "Advento", "reflexao": "Isaías descreve a missão do Servo — que Jesus aplica a si mesmo em Nazaré. As boas novas são para os pobres, a liberdade para os cativos, a cura para os quebrantados. Este programa do Advento é o programa de toda a vida cristã: anunciar boas novas onde há má notícia.", "oracao": "Espírito que ungiste Jesus, unge-me também para anunciar boas novas. Que minha vida seja boa notícia para alguém que precisa. Amém."}, "12-12": {"ref": "Ap 12,1", "verso": "E apareceu no céu um grande sinal: uma mulher vestida do sol.", "tema": "Nossa Senhora de Guadalupe", "reflexao": "Nossa Senhora de Guadalupe apareceu ao índio Juan Diego em 1531, com traços mestiços, gravidez visível, rodeada do sol. Sua imagem foi a maior evangelização da história: milhões de astecas se converteram ao ver a Mãe de Deus nas suas feições. Deus sempre se encarna na cultura local.", "oracao": "Nossa Senhora de Guadalupe, Mãe das Américas, rogai por nós. Que como Juan Diego, eu seja mensageiro fiel mesmo quando parece impossível. Amém."}, "12-13": {"ref": "Jo 1,5", "verso": "E a luz resplandece nas trevas, e as trevas não a compreenderam.", "tema": "Santa Luzia", "reflexao": "Santa Luzia — cujo nome significa 'luz' — é celebrada no tempo de maior escuridão do inverno europeu. As trevas não compreenderam a luz — não a absolveram, não a extinguiram. A luz continua resplandecendo apesar da incompreensão. Sua fidelidade na escuridão é o sinal mais poderoso.", "oracao": "Santa Luzia, luz no escuro, intercede por todos que vivem nas trevas. Senhor, que tua luz resplandeça nas minhas trevas e não seja extinta. Amém."}, "12-14": {"ref": "Fl 3,8", "verso": "Mas também tenho todas as coisas por perda, pela excelência do conhecimento de Cristo Jesus meu Senhor.", "tema": "São João da Cruz", "reflexao": "São João da Cruz — místico do esvaziamento — escreveu 'A Subida do Monte Carmelo' e 'A Noite Escura da Alma'. Como Paulo, considerou tudo perda para ganhar Cristo. A noite escura que ele descreve não é desespero — é purificação que prepara para a união mais profunda com Deus.", "oracao": "São João da Cruz, que soubeste encontrar Deus na noite escura, intercede por mim nos meus momentos de aridez espiritual. Amém."}, "12-15": {"ref": "Is 12,2", "verso": "Eis que Deus é a minha salvação; confiarei e não temerei; porque o Senhor Jeová é a minha força e o meu cântico, e se tornou a minha salvação.", "tema": "Advento", "reflexao": "'Confiarei e não temerei' — a confiança que elimina o medo não vem de circunstâncias favoráveis, mas da certeza de que Deus é salvação. Esta declaração de Isaías é o cântico do Advento: Deus mesmo é força, cântico e salvação. Não há mais nada que precisemos buscar fora.", "oracao": "Senhor minha força e meu cântico, confio em ti e não temerei. Que esta confiança seja minha declaração de fé neste Advento. Amém."}, "12-16": {"ref": "Lc 1,17", "verso": "E irá adiante dele com o espírito e o poder de Elias.", "tema": "Advento", "reflexao": "João Batista viria com o poder de Elias para preparar o caminho do Senhor. O Advento é o tempo de preparar caminhos — no coração, nas famílias, nas comunidades. Cada cristão é chamado a ser João Batista para alguém: a preparar o encontro de pessoas com Cristo.", "oracao": "Senhor, envia-me com o espírito de Elias e João Batista para preparar teu caminho. Que minha vida prepare o encontro de alguém com Cristo este Natal. Amém."}, "12-17": {"ref": "Is 7,14", "verso": "Portanto, o mesmo Senhor vos dará um sinal: eis que a virgem conceberá, e dará à luz um filho, e chamará o seu nome Emanuel.", "tema": "Advento", "reflexao": "A grande profecia do Advento: Emanuel — Deus conosco. Não apenas 'Deus por nós' ou 'Deus para nós', mas 'conosco'. Esta preposição simples é a mais profunda da história da salvação. Deus não opera de longe — habita entre nós, partilha nossa condição, caminha conosco.", "oracao": "Emanuel, Deus conosco, que vieste habitar entre nós, vem novamente ao meu coração neste Natal. Amém."}, "12-18": {"ref": "Mt 1,23", "verso": "Eis que a virgem conceberá e dará à luz um filho, e o seu nome será chamado Emanuel, que quer dizer: Deus conosco.", "tema": "Advento", "reflexao": "Mateus cita Isaías para revelar a identidade de Jesus: Emanuel. Este nome não é apenas título honorífico — é declaração ontológica. Jesus não é mensageiro de Deus — é Deus mesmo conosco. O Natal é a celebração desta presença que mudou a história para sempre.", "oracao": "Deus conosco, prepara meu coração para te receber novamente neste Natal. Que não seja apenas celebração cultural mas encontro real com o Emanuel. Amém."}, "12-19": {"ref": "Lc 1,13", "verso": "Mas o anjo disse-lhe: Não temas, Zacarias; porque a tua oração foi ouvida.", "tema": "Advento", "reflexao": "Zacarias havia rezado por um filho durante décadas — e aparentemente desistido. 'A tua oração foi ouvida' — mesmo as que achamos esquecidas. Deus guarda as orações. Nenhuma oração sincera se perde. O anúncio do nascimento de João era resposta a orações que Zacarias talvez já não esperasse ver respondidas.", "oracao": "Senhor que guardas todas as orações, obrigado por não esquecer nenhuma. Aviva em mim a esperança pelas petições que ainda aguardam. Amém."}, "12-20": {"ref": "Is 9,6", "verso": "Porque um menino nos nasceu, um filho se nos deu; o governo está sobre os seus ombros.", "tema": "Advento", "reflexao": "'Um menino nos nasceu' — a ênfase está no dom recebido, não na conquista alcançada. O Messias não é conquista nossa — é presente de Deus. O Natal é antes de tudo recepção de um dom que não merecemos. A salvação não é mérito — é graça. O governo está sobre os ombros dele, não nossos.", "oracao": "Pai, obrigado pelo dom do Filho. Que eu receba Jesus como o dom que é — não como conquista religiosa, mas como graça pura. Amém."}, "12-21": {"ref": "Sl 25,5", "verso": "Guia-me na tua verdade, e ensina-me, porque tu és o Deus da minha salvação.", "tema": "Advento", "reflexao": "No solstício de inverno — o dia mais curto do ano no hemisfério norte — a Igreja pede orientação divina. 'Guia-me na tua verdade' — não na minha verdade, não na verdade do mundo. A verdade de Deus não é opinião — é realidade que salva. Deixar-se guiar por ela é liberdade.", "oracao": "Deus da minha salvação, guia-me. Que meus caminhos não se afastem da tua verdade. Ensina-me o que preciso saber para seguir-te. Amém."}, "12-22": {"ref": "Lc 1,46", "verso": "A minha alma engrandece ao Senhor, e o meu espírito se alegrou em Deus, meu Salvador.", "tema": "Advento", "reflexao": "O Magnificat de Maria é o hino do Advento que vai chegando ao fim. A alma que engrandece ao Senhor é aquela que coloca Deus no centro e vai diminuindo o ego. Maria é o modelo desta auto-esvaziamento alegre: ela engrandece a Deus, não a si mesma, e encontra nisso alegria profunda.", "oracao": "Maria, ensina-me a cantar o Magnificat com a vida inteira. Que minha alma engrandeça ao Senhor e meu espírito se alegre em Deus meu Salvador. Amém."}, "12-23": {"ref": "Lc 1,80", "verso": "E o menino crescia e se fortalecia em espírito, e esteve nos desertos até ao dia em que se havia de manifestar a Israel.", "tema": "Advento", "reflexao": "João Batista cresceu no deserto — em silêncio, em preparação, em anonimato — antes de se manifestar. O Advento nos convida a este crescimento interior silencioso. A preparação do Natal não é nos eventos externos — é no crescimento interior que nos torna capazes de receber o que vem.", "oracao": "Senhor, faz-me crescer e fortalecer em espírito neste tempo de Advento. Que o silêncio interior me prepare para te receber. Amém."}, "12-24": {"ref": "Is 9,2", "verso": "O povo que andava em trevas viu uma grande luz; sobre os que habitavam na região da sombra da morte resplandeceu a luz.", "tema": "Véspera do Natal", "reflexao": "Na noite de Natal, a profecia de Isaías se cumpre: uma grande luz irrompe nas trevas. Não uma luz pequena, não uma luz que torna as trevas um pouco menos escuras — uma grande luz. A vinda de Cristo ao mundo é ruptura radical, não ajuste gradual. O mundo mudou naquela noite.", "oracao": "Cristo que vens como grande luz nas trevas, ilumina a noite do meu coração. Que esta noite sagrada seja para mim um novo começo. Amém."}, "12-25": {"ref": "Jo 1,14", "verso": "E o Verbo se fez carne e habitou entre nós, e vimos a sua glória, como a glória do Unigênito do Pai, cheio de graça e de verdade.", "tema": "Natal do Senhor", "reflexao": "O versículo mais importante da história humana: o Verbo eterno se fez carne. Não fingiu ter corpo — assumiu plenamente a natureza humana. E habitou entre nós — acampou conosco, partilhou nossa vida. Cheio de graça e de verdade: tudo o que precisamos para a vida eterna veio morar entre nós. Aleluia!", "oracao": "Verbo encarnado, obrigado por vires. Obrigado por não ficares distante. Nasces hoje novamente no meu coração — recebo-te com toda a alegria do Natal. Amém."}, "12-26": {"ref": "At 7,60", "verso": "E, ajoelhando-se, clamou em alta voz: Senhor, não lhes imputes este pecado. E, tendo dito isto, adormeceu.", "tema": "São Estêvão", "reflexao": "No dia seguinte ao Natal, a Igreja celebra o primeiro mártir. Estêvão morreu pedindo perdão para os que o apedrejavam — como Jesus na cruz. O Natal que celebrou ontem o amor de Deus que se doa exige hoje a resposta de um amor que perdoa. Da festa ao testemunho.", "oracao": "São Estêvão, que perdoaste no momento da morte, intercede por mim. Senhor, dá-me este amor que perdoa mesmo quando dói. Amém."}, "12-27": {"ref": "Jo 21,20", "verso": "Pedro, voltando-se, viu que o discípulo amado o seguia — aquele que na ceia recostara sobre o peito de Jesus.", "tema": "São João Evangelista", "reflexao": "João — o discípulo amado — é o modelo da contemplação. Ele recostou no peito de Jesus, ouviu o coração do Mestre, recebeu Maria como mãe ao pé da cruz, foi o primeiro a crer na ressurreição. Sua espiritualidade é de intimidade — conhecer a Jesus de dentro para fora.", "oracao": "São João, discípulo amado, ensina-me a reclinar sobre o peito de Jesus. Que minha fé seja de intimidade, não apenas de conhecimento. Amém."}, "12-28": {"ref": "Jr 31,15", "verso": "Assim diz o Senhor: Ouviu-se uma voz em Ramá, pranto e amargo choro; Raquel chorando por seus filhos.", "tema": "Santos Inocentes", "reflexao": "Os Santos Inocentes — os meninos mortos por Herodes — são os primeiros mártires, mártires sem saber. A violência que persegue o menino Jesus é a violência que em todos os séculos persegue o inocente. O choro de Raquel ainda ecoa — em cada criança vítima de violência, guerra, abandono.", "oracao": "Senhor, que recebestes os inocentes mártires ao teu Coração, protege as crianças vulneráveis do mundo inteiro. Amém."}, "12-29": {"ref": "Lc 2,36-37", "verso": "E havia uma profetisa, Ana, filha de Fanuel, da tribo de Aser; era já avançada em idade, e tinha vivido sete anos com seu marido depois da sua virgindade; e era viúva de cerca de oitenta e quatro anos; não se retirava do templo, servindo a Deus com jejuns e orações noite e dia.", "tema": "São Tomás Becket", "reflexao": "Ana, a profetisa, viveu 84 anos no templo em oração — e foi recompensada ao ver o Menino Jesus. São Tomás Becket morreu no altar de sua catedral pela fidelidade à Igreja. A perseverança na fidelidade — mesmo quando custosa, mesmo quando longa — é sempre recompensada por Deus.", "oracao": "Senhor, dá-me a fidelidade de Ana e de Tomás Becket. Que persevere na oração e na fidelidade até receber o que espero. Amém."}, "12-30": {"ref": "Lc 2,40", "verso": "E o menino crescia e se fortalecia em espírito, cheio de sabedoria; e a graça de Deus era sobre ele.", "tema": "Sagrada Família", "reflexao": "Na festa da Sagrada Família, contemplamos Jesus crescendo — como qualquer criança humana — em sabedoria e graça. A família de Nazaré era o ambiente desta formação. Cada família é chamada a ser escola de humanidade e de fé, lugar onde se cresce em espírito e sabedoria.", "oracao": "Jesus, Maria e José — Sagrada Família — abençoai nossas famílias. Que sejam escolas de amor, perdão e crescimento em sabedoria. Amém."}, "12-31": {"ref": "Sl 90,1", "verso": "Senhor, tu tens sido o nosso refúgio de geração em geração.", "tema": "Réveillon", "reflexao": "No último dia do ano, olhamos para trás com gratidão: 'de geração em geração'. Deus foi fiel no ano que termina como foi fiel em todos os anteriores. Toda a história humana é protegida por este refúgio permanente. E o ano que começa amanhã estará sob a mesma fidelidade.", "oracao": "Senhor, refúgio de geração em geração, obrigado pelo ano que termina. Fostes fiel quando falhei. Graças por cada graça, cada proteção, cada oportunidade. Recebe minha vida no ano que começa. Amém."}, "02-29": {"ref": "Sl 31,15", "verso": "Os meus tempos estão nas tuas mãos.", "tema": "Dia Bissexto", "reflexao": "O dia 29 de fevereiro existe apenas nos anos bissextos — um dia extra que o calendário concede a cada quatro anos. 'Os meus tempos estão nas tuas mãos' — cada dia, cada hora, cada segundo é dom de Deus. Este dia extra é lembrete de que o tempo não nos pertence; é administrado pela sabedoria do Criador que sustenta toda ordem do universo.", "oracao": "Senhor do tempo e da eternidade, meus tempos estão nas tuas mãos. Que eu use cada dia — incluindo este dia extra — para te glorificar e amar o próximo. Amém."}};

// ═══════════════════════════════════════════
// UTILITÁRIOS
// ═══════════════════════════════════════════
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                  'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_PT  = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

function hoje() {
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dia = String(d.getDate()).padStart(2,'0');
  return { chave: m+'-'+dia, dia: d.getDate(), mes: d.getMonth(), ano: d.getFullYear(), semana: d.getDay() };
}

function chaveData(d) {
  const m = String(d.getMonth()+1).padStart(2,'0');
  const dia = String(d.getDate()).padStart(2,'0');
  return m+'-'+dia;
}

// ═══════════════════════════════════════════
// ABAS
// ═══════════════════════════════════════════
function mudarAba(id, btn) {
  document.querySelectorAll('.conteudo').forEach(el => el.classList.remove('ativo'));
  document.querySelectorAll('.aba').forEach(el => el.classList.remove('ativa'));
  document.getElementById('aba-'+id).classList.add('ativo');
  btn.classList.add('ativa');
  if (id === 'liturgia') renderLiturgia();
}

// ═══════════════════════════════════════════
// ABA VERSÍCULO
// ═══════════════════════════════════════════
function renderVersiculo() {
  const { chave, dia, mes, ano, semana } = hoje();
  document.getElementById('headerData').innerHTML =
    DIAS_PT[semana]+'<br>'+dia+' de '+MESES_PT[mes]+' de '+ano;

  const d = DIAS365[chave];
  if (!d) { document.getElementById('loader-versiculo').textContent = 'Palavra não encontrada para hoje.'; return; }

  document.getElementById('v-tema').textContent = d.tema;
  document.getElementById('v-ref').textContent = d.ref;
  document.getElementById('v-verso').textContent = '"'+d.verso+'"';
  document.getElementById('v-reflexao').textContent = d.reflexao;
  document.getElementById('v-oracao').textContent = d.oracao;

  document.getElementById('loader-versiculo').style.display = 'none';
  document.getElementById('versiculo-conteudo').style.display = 'block';
}

// ═══════════════════════════════════════════
// ABA LITURGIA — próximos 30 dias
// ═══════════════════════════════════════════
function renderLiturgia() {
  const grid = document.getElementById('liturgia-grid');
  if (grid.innerHTML) return;
  const base = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(base);
    d.setDate(base.getDate()+i);
    const chave = chaveData(d);
    const dado = DIAS365[chave];
    if (!dado) continue;
    const card = document.createElement('div');
    card.className = 'liturgia-card';
    card.innerHTML = `
      <div class="liturgia-card-data">${d.getDate()} de ${MESES_PT[d.getMonth()]}</div>
      <div class="liturgia-card-tema">${dado.tema}</div>
      <div class="liturgia-card-ref">${dado.ref} — "${dado.verso.substring(0,60)}..."</div>`;
    card.onclick = () => abrirModal(dado, d);
    grid.appendChild(card);
  }
}

function abrirModal(d, data) {
  document.getElementById('modal-tema').textContent = d.tema + ' — ' + data.getDate()+'/'+String(data.getMonth()+1).padStart(2,'0');
  document.getElementById('modal-ref').textContent = d.ref;
  document.getElementById('modal-verso').textContent = '"'+d.verso+'"';
  document.getElementById('modal-reflexao').textContent = d.reflexao;
  document.getElementById('modal-oracao').textContent = d.oracao;
  document.getElementById('liturgiaModal').classList.add('aberto');
  document.body.style.overflow = 'hidden';
}

function fecharModal() {
  document.getElementById('liturgiaModal').classList.remove('aberto');
  document.body.style.overflow = '';
}
document.getElementById('liturgiaModal').onclick = function(e) {
  if (e.target === this) fecharModal();
};

// ═══════════════════════════════════════════
// ABA BÍBLIA — via bible-api.com (almeida)
// ═══════════════════════════════════════════
const capsPorLivro = {
  "Genesis":50,"Exodus":40,"Leviticus":27,"Numbers":36,"Deuteronomy":34,
  "Joshua":24,"Judges":21,"Ruth":4,"1 Samuel":31,"2 Samuel":24,
  "1 Kings":22,"2 Kings":25,"1 Chronicles":29,"2 Chronicles":36,
  "Ezra":10,"Nehemiah":13,"Esther":10,"Job":42,"Psalms":150,
  "Proverbs":31,"Ecclesiastes":12,"Song of Solomon":8,"Isaiah":66,
  "Jeremiah":52,"Lamentations":5,"Ezekiel":48,"Daniel":12,"Hosea":14,
  "Joel":3,"Amos":9,"Obadiah":1,"Jonah":4,"Micah":7,"Nahum":3,
  "Habakkuk":3,"Zephaniah":3,"Haggai":2,"Zechariah":14,"Malachi":4,
  "Matthew":28,"Mark":16,"Luke":24,"John":21,"Acts":28,"Romans":16,
  "1 Corinthians":16,"2 Corinthians":13,"Galatians":6,"Ephesians":6,
  "Philippians":4,"Colossians":4,"1 Thessalonians":5,"2 Thessalonians":3,
  "1 Timothy":6,"2 Timothy":4,"Titus":3,"Philemon":1,"Hebrews":13,
  "James":5,"1 Peter":5,"2 Peter":3,"1 John":5,"2 John":1,
  "3 John":1,"Jude":1,"Revelation":22
};

document.getElementById('livroSelect').addEventListener('change', function() {
  const caps = capsPorLivro[this.value] || 1;
  const sel = document.getElementById('capSelect');
  sel.innerHTML = '';
  for (let i=1; i<=caps; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = 'Cap. '+i;
    sel.appendChild(opt);
  }
});

async function carregarCapitulo() {
  const livro = document.getElementById('livroSelect').value;
  const cap = document.getElementById('capSelect').value;
  const div = document.getElementById('biblia-resultado');
  div.style.display = 'block';
  div.innerHTML = '<div class="biblia-loading">Carregando capítulo...</div>';

  try {
    const enc = encodeURIComponent(livro+' '+cap);
    const r = await fetch('https://bible-api.com/'+enc+'?translation=almeida');
    if (!r.ok) throw new Error();
    const data = await r.json();
    const verses = data.verses || [];

    const nomesPT = {
      "Genesis":"Gênesis","Exodus":"Êxodo","Leviticus":"Levítico","Numbers":"Números",
      "Deuteronomy":"Deuteronômio","Joshua":"Josué","Judges":"Juízes","Ruth":"Rute",
      "1 Samuel":"1 Samuel","2 Samuel":"2 Samuel","1 Kings":"1 Reis","2 Kings":"2 Reis",
      "1 Chronicles":"1 Crônicas","2 Chronicles":"2 Crônicas","Ezra":"Esdras",
      "Nehemiah":"Neemias","Esther":"Ester","Job":"Jó","Psalms":"Salmos",
      "Proverbs":"Provérbios","Ecclesiastes":"Eclesiastes","Song of Solomon":"Cântico dos Cânticos",
      "Isaiah":"Isaías","Jeremiah":"Jeremias","Lamentations":"Lamentações",
      "Ezekiel":"Ezequiel","Daniel":"Daniel","Hosea":"Oséias","Joel":"Joel",
      "Amos":"Amós","Obadiah":"Obadias","Jonah":"Jonas","Micah":"Miquéias",
      "Nahum":"Naum","Habakkuk":"Habacuque","Zephaniah":"Sofonias","Haggai":"Ageu",
      "Zechariah":"Zacarias","Malachi":"Malaquias","Matthew":"Mateus","Mark":"Marcos",
      "Luke":"Lucas","John":"João","Acts":"Atos","Romans":"Romanos",
      "1 Corinthians":"1 Coríntios","2 Corinthians":"2 Coríntios","Galatians":"Gálatas",
      "Ephesians":"Efésios","Philippians":"Filipenses","Colossians":"Colossenses",
      "1 Thessalonians":"1 Tessalonicenses","2 Thessalonians":"2 Tessalonicenses",
      "1 Timothy":"1 Timóteo","2 Timothy":"2 Timóteo","Titus":"Tito",
      "Philemon":"Filemom","Hebrews":"Hebreus","James":"Tiago","1 Peter":"1 Pedro",
      "2 Peter":"2 Pedro","1 John":"1 João","2 John":"2 João","3 John":"3 João",
      "Jude":"Judas","Revelation":"Apocalipse"
    };

    const nomePT = nomesPT[livro] || livro;
    const caps = capsPorLivro[livro] || 1;
    const capAtual = parseInt(cap);

    let html = '<div class="biblia-capitulo-titulo">'+nomePT+' – Capítulo '+cap+'</div>';
    verses.forEach(v => {
      html += '<div class="biblia-versiculo"><strong>'+v.verse+'</strong>'+v.text.trim()+'</div>';
    });
    html += '<div class="nav-caps">';
    if (capAtual > 1) html += '<button class="nav-cap-btn" onclick="irCap('+(capAtual-1)+')">← Cap. '+(capAtual-1)+'</button>';
    if (capAtual < caps) html += '<button class="nav-cap-btn" onclick="irCap('+(capAtual+1)+')">Cap. '+(capAtual+1)+' →</button>';
    html += '</div>';
    div.innerHTML = html;
  } catch(e) {
    div.innerHTML = '<div class="biblia-loading">Não foi possível carregar. Verifique sua conexão.</div>';
  }
}

function irCap(n) {
  document.getElementById('capSelect').value = n;
  carregarCapitulo();
}

// INIT
renderVersiculo();
</script>
